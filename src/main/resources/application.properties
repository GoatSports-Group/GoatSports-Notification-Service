# APPLICATION
spring.application.name=GOATSPORTS-NOTIFICATION-SERVICE
spring.threads.virtual.enabled=true
server.port=${SERVER_PORT}
# SQL
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
# EUREKA
eureka.client.enabled=${EUREKA_CLIENT_ENABLED}
spring.cloud.discovery.enabled=${EUREKA_DISCOVERY_ENABLED}
eureka.client.service-url.defaultZone=${EUREKA_SERVICE_URL}
eureka.instance.prefer-ip-address=${EUREKA_SERVICE_PREFER_IP_ADDRESS}
# SERVICES
auth.service.url=${AUTH_SERVICE_URL}
# JWT
app.jwt.secret=${JWT_SECRET}
# KAFKA
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.topic.user-log=${KAFKA_TOPIC_USER_LOG}
payment.events.topic=${PAYMENT_EVENTS_TOPIC}
payment.events.notification-group-id=${PAYMENT_EVENTS_NOTIFICATION_GROUP_ID}
payment.events.notification-consumer-enabled=${PAYMENT_EVENTS_NOTIFICATION_CONSUMER_ENABLED}
club.events.topic=${CLUB_EVENTS_TOPIC}
club.events.notification-group-id=${CLUB_EVENTS_NOTIFICATION_GROUP_ID}
club.events.notification-consumer-enabled=${CLUB_EVENTS_NOTIFICATION_CONSUMER_ENABLED}
social.events.topic=${SOCIAL_EVENTS_TOPIC}
social.events.notification-group-id=${SOCIAL_EVENTS_NOTIFICATION_GROUP_ID}
social.events.notification-consumer-enabled=${SOCIAL_EVENTS_NOTIFICATION_CONSUMER_ENABLED}
# ACTUATOR
management.endpoints.web.exposure.include=health,info,prometheus
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.status.http-mapping.UP=200
management.endpoint.health.status.http-mapping.DOWN=503
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# LOGGING
logging.level.root=INFO
logging.level.me.minhdat=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{correlationId:-}] - %msg%n
# SWAGGER
springdoc.api-docs.enabled=false
springdoc.api-docs.version=openapi_3_0
springdoc.swagger-ui.enabled=false
# PAGINATION
spring.data.web.pageable.one-indexed-parameters=true
spring.data.web.pageable.max-page-size=20
# JSON
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh